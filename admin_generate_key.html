<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Генератор ключей</title>
<style>body{font-family:Arial,sans-serif;background:#0f172a;color:#fff;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}.box{max-width:420px;width:100%;background:#1e293b;border:1px solid #334155;border-radius:20px;padding:22px;box-shadow:0 20px 50px #0008}input,button{width:100%;height:52px;border-radius:14px;border:1px solid #334155;margin:8px 0;font-size:17px;box-sizing:border-box}input{background:#0f172a;color:#fff;padding:0 14px}button{background:#2563eb;color:#fff;font-weight:800;cursor:pointer}.key{margin-top:14px;background:#0f172a;border:1px solid #334155;border-radius:14px;padding:14px;word-break:break-all;font-size:20px;font-weight:900;color:#38bdf8}.note{color:#fbbf24;font-size:14px;line-height:1.4}</style></head>
<body><div class="box"><h2>🔐 Генератор ключей</h2><p>Введите Telegram ID пользователя:</p><input id="uid" placeholder="Например: 123456789"><button onclick="gen()">Сгенерировать ключ</button><div id="out" class="key">Ключ появится здесь</div><p class="note">Этот файл не загружайте на публичный сайт и GitHub. Он только для администратора.</p></div>
<script>function generateUserKey(userId){const secret="ECONOMY_PRO_NURISLOMBEK_30000";const raw=`${secret}_${userId}_ONE_ID_ONE_KEY`;return btoa(unescape(encodeURIComponent(raw))).replace(/=/g,'').substring(0,24).toUpperCase()}function gen(){const id=document.getElementById('uid').value.trim();document.getElementById('out').innerText=id?generateUserKey(id):'Введите ID';}</script></body></html>
